[package]
name = "shows-core"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22.1"
chrono = "0.4.44"
log = "0.4.30"
rusqlite = { version = "0.40.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
ureq = "3.3.0"
urlencoding = "2.1.3"
uuid = { version = "1.23.2", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"
