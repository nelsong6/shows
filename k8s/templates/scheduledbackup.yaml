{{- /*
Daily base backup for the shows-db Cluster. Continuous WAL archiving is
configured on the Cluster itself (in .spec.backup.barmanObjectStore);
this resource schedules the periodic base backup CNPG anchors its
point-in-time recovery against.

backupOwnerReference: self — the Backup resource each schedule creates
owns itself (not the ScheduledBackup), so deleting the ScheduledBackup
doesn't cascade-delete the historical backups.

immediate: true — kick off one base backup right after creation so we
don't wait until the next 03:30 UTC window for the first one.
*/}}
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: shows-db-daily
  namespace: shows
spec:
  # 6-field cron (seconds-resolution) per CNPG schema. 03:30:00 UTC,
  # offset from auth's 03:00 to avoid backups colliding on the same
  # storage path provider.
  schedule: "0 30 3 * * *"
  backupOwnerReference: self
  immediate: true
  cluster:
    name: shows-db
