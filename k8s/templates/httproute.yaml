# Dual parentRef: XListenerSet for HTTPS serving, main Gateway for HTTP
# (and so ExternalDNS creates the A record — external-dns#5694 tracks
# native XListenerSet source support). Mirrors auth's pattern at
# auth/k8s/templates/httproute.yaml.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: shows
  namespace: shows
spec:
  hostnames:
    - shows.romaine.life
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: main
      namespace: envoy-gateway-system
    - group: gateway.networking.x-k8s.io
      kind: XListenerSet
      name: shows
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: shows
          port: 80
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
