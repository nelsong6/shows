apiVersion: apps/v1
kind: Deployment
metadata:
  name: shows
  namespace: shows
  labels:
    app: shows
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shows
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: shows
        # azwi keys on this pod label to project the workload-identity
        # token volume. Without it, the SA annotation on its own does
        # nothing.
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: shows
      containers:
        - name: shows
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            # Cosmos client config. DefaultAzureCredential will pick up
            # the projected SA token and exchange it for a data-plane
            # token scoped to dbs/shows (see tofu/db.tf).
            - name: COSMOS_ENDPOINT
              value: {{ .Values.cosmos.endpoint | quote }}
            - name: COSMOS_DATABASE
              value: {{ .Values.cosmos.database | quote }}
            - name: AUTH_ROMAINE_LIFE_ISSUER
              value: {{ .Values.auth.issuer | quote }}
            - name: AUTH_ROMAINE_LIFE_JWKS_URL
              value: {{ .Values.auth.jwksUrl | quote }}
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            failureThreshold: 3
