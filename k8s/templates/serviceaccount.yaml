# ServiceAccount for the shows-api pod. Annotated with the
# shows-identity UAMI's client_id so the azwi mutating webhook projects
# a federated token at /var/run/secrets/azure/tokens/azure-identity-token
# on pod creation. The Go store uses DefaultAzureCredential to pick that
# up and exchange for a Cosmos data-plane token scoped to dbs/shows.
#
# The matching pod-level label `azure.workload.identity/use: "true"` is
# set on the Deployment template — both are required for the webhook to
# inject the token volume.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: shows
  namespace: shows
  annotations:
    azure.workload.identity/client-id: {{ .Values.identity.workloadIdentityClientId | quote }}
