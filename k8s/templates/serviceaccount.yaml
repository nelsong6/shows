# Plain ServiceAccount. The shows-api pod has no direct Azure dependencies
# at runtime — DB creds come from the CNPG-managed `shows-db-app` Secret,
# and the auth.romaine.life verifier fetches the public JWKS over HTTPS
# without an Azure identity. Add workload-identity annotations later if
# the API grows a need to call Azure directly.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: shows
  namespace: shows
