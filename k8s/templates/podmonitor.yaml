{{- /*
PodMonitor for the shows-api Deployment. Scrapes /metrics on the
existing :http port (8080); the handler is registered in
internal/api/api.go and exports the shows_* counters/histograms
declared in internal/api/metrics.go plus prom client's default
Go runtime / process / GC metrics.

Same shape as auth/k8s/templates/podmonitor.yaml. The
kube-prometheus-stack in the `monitoring` namespace picks this up
via its default release-label selector.
*/}}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: shows
  namespace: shows
  labels:
    app.kubernetes.io/name: shows
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: shows
  podMetricsEndpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
