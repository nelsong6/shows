name: Release

# Cuts a release at the current HEAD of main and dispatches build.yml to
# attach the cross-compiled Windows binaries. Manual trigger only — run
# via `gh workflow run release.yml -R nelsong6/shows`. Matches the
# fzt-automate pattern.

on:
  workflow_dispatch:

concurrency:
  group: release-tag
  cancel-in-progress: false

permissions:
  contents: write
  actions: write
  id-token: write

jobs:
  release:
    uses: nelsong6/pipeline-templates/.github/workflows/release-and-dispatch-template.yml@main
    with:
      artifact-build-workflow: build.yml
