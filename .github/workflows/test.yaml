name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

  desktop-tests:
    name: desktop pure-logic tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Only httpx + pytest: the tests touch shows.roundlogic and
      # shows.apiclient, neither of which imports Qt or libmpv, so the heavy
      # PySide6/python-mpv runtime deps aren't needed here.
      - name: Install test deps
        run: pip install httpx pytest

      - name: pytest
        working-directory: desktop-qt
        run: pytest
