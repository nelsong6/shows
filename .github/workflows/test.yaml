name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-tests:
    name: desktop pure-logic tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect Rust changes
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ] || git diff --name-only "$BASE_SHA"...HEAD | grep -qE '^(desktop-rs/(core|control|desktop|remote)/|desktop-rs/Cargo|\.github/workflows/test\.yaml$)'; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "rust=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: dtolnay/rust-toolchain@stable
        if: steps.changes.outputs.rust == 'true'

      - uses: Swatinem/rust-cache@v2
        if: steps.changes.outputs.rust == 'true'
        with:
          workspaces: desktop-rs

      # `shows-core` is `#![forbid(unsafe_code)]` and Win32/libmpv-free, so the
      # 73-test suite (ordering / roundlogic / scan / update / engine / replica
      # / apiclient / oauth / sync / runner / model) runs fine on Linux. This
      # is the cheap per-PR sanity check; the Windows-only shell goes through
      # `build-desktop.yaml`.
      - name: Test engine, control protocol and terminal remote
        if: steps.changes.outputs.rust == 'true'
        working-directory: desktop-rs
        run: cargo test -p shows-core -p shows-control -p shows-remote --locked
