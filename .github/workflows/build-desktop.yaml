name: Build Desktop

# Packages shows-desktop (the Rust client under desktop-rs/) for Windows.
# The release zip bundles the cargo --release binary, the React overlay's
# built dist, and libmpv-2.dll. On push to main the job publishes a GitHub
# Release (zip) tagged with the short SHA and marked `--latest`; on PRs /
# dispatch it validates the build and uploads the zip as an artifact.

on:
  push:
    branches: [main]
    paths:
      - desktop-rs/**
      - .github/workflows/build-desktop.yaml
  # No paths filter on PRs: keep the status check reporting, and
  # short-circuit inside when nothing relevant changed.
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # gh release create + upload assets

concurrency:
  group: build-desktop-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Package shows-desktop for Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # PR short-circuit: always trigger (so the check reports), but skip
      # the Windows build when the PR touched nothing relevant.
      - name: Detect relevant changes
        id: changes
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # Auto-merge can squash this PR onto main before this check finishes —
          # it races the merge. Once the PR is no longer OPEN the build is moot,
          # and diffing the moved base fails ("no merge base"), so bail cleanly.
          state="$(gh pr view "$PR_NUMBER" --json state -q .state)"
          if [ "$state" != "OPEN" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::PR is $state, not OPEN — skipping desktop build."
            exit 0
          fi
          # Diff against the PR's immutable base SHA — already present via the
          # checkout's full history (fetch-depth: 0) and a guaranteed ancestor of
          # HEAD — instead of a freshly shallow-fetched origin/main, which can
          # land past the merge base when main advances during the PR.
          changed="$(git diff --name-only "$BASE_SHA"...HEAD)"
          echo "$changed"
          if printf '%s\n' "$changed" | grep -qE '^(desktop-rs/|\.github/workflows/build-desktop\.yaml$)'; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::No desktop-rs/ changes — short-circuiting."
          fi

      - name: Setup Rust (stable MSVC)
        if: steps.changes.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo target
        if: steps.changes.outputs.skip != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-rs

      - name: Setup Node
        if: steps.changes.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: desktop-rs/frontend/package-lock.json

      - name: Build React overlay
        if: steps.changes.outputs.skip != 'true'
        working-directory: desktop-rs/frontend
        run: |
          npm ci
          npm run build

      # libmpv runtime: the same dev .7z the Go/Python builds used. The
      # release bundle ships libmpv-2.dll next to shows-desktop.exe; the
      # Rust dynamic loader (libloading) picks it up at runtime. Bump the
      # cache key when libmpv bumps.
      - name: Cache libmpv runtime
        if: steps.changes.outputs.skip != 'true'
        id: libmpv-cache
        uses: actions/cache@v4
        with:
          path: desktop-rs/desktop/third_party/libmpv
          key: libmpv-windows-20250420-3600c71

      - name: Fetch libmpv (cold cache only)
        if: steps.changes.outputs.skip != 'true' && steps.libmpv-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          version=20250420
          hash=3600c71
          file="mpv-dev-x86_64-${version}-git-${hash}.7z"
          url="https://master.dl.sourceforge.net/project/mpv-player-windows/libmpv/${file}?viasf=1"
          mkdir -p desktop-rs/desktop/third_party/libmpv
          curl -fSL -o /tmp/libmpv.7z "$url"
          7z x /tmp/libmpv.7z -odesktop-rs/desktop/third_party/libmpv -y
          test -f desktop-rs/desktop/third_party/libmpv/libmpv-2.dll

      - name: cargo test (shows-core)
        if: steps.changes.outputs.skip != 'true'
        working-directory: desktop-rs
        run: cargo test -p shows-core --release

      - name: cargo build --release
        if: steps.changes.outputs.skip != 'true'
        working-directory: desktop-rs
        # `SHOWS_BUILD_SHA` is read at compile time by `core/src/update.rs`
        # via `option_env!`. With it set, the running app can compare its
        # SHA to the latest GitHub Release and offer the overlay's update
        # banner; without it (a source/dev run), `update.rs` returns `None`
        # and the banner stays hidden — exactly the dev-vs-release contract
        # the Python build had with `_build.py`.
        env:
          SHOWS_BUILD_SHA: ${{ github.sha }}
          SHOWS_UPDATE_CHANNEL: stable
        run: cargo build --release -p shows-desktop

      # Stage the bundle: shows-desktop.exe + libmpv-2.dll
      - name: Stage release bundle
        if: steps.changes.outputs.skip != 'true'
        shell: pwsh
        run: |
          $out = "desktop-rs/dist/shows-desktop"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item desktop-rs/target/release/shows-desktop.exe "$out/" -Force
          Copy-Item desktop-rs/desktop/third_party/libmpv/libmpv-2.dll "$out/" -Force
          if (-not (Test-Path "$out/shows-desktop.exe")) { throw "build failed: shows-desktop.exe missing" }
          if (-not (Test-Path "$out/libmpv-2.dll"))     { throw "bundle missing libmpv-2.dll" }

      - name: Zip bundle
        if: steps.changes.outputs.skip != 'true'
        shell: pwsh
        working-directory: desktop-rs
        run: Compress-Archive -Path dist/shows-desktop/* -DestinationPath dist/shows-desktop-windows-amd64.zip -Force

      # PR + dispatch: upload the zip for download/debugging. Push-to-main
      # distributes via the Release below.
      - name: Upload workflow artifact
        if: steps.changes.outputs.skip != 'true' && (github.event_name != 'push' || github.ref != 'refs/heads/main')
        uses: actions/upload-artifact@v4
        with:
          name: shows-desktop-${{ github.sha }}
          path: desktop-rs/dist/shows-desktop-windows-amd64.zip
          if-no-files-found: error
          retention-days: 30

      # Push-to-main: publish a Release tagged with the short SHA, marked
      # --latest so the Releases page surfaces the freshest build.
      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha_short="${GITHUB_SHA:0:7}"
          tag="desktop-${sha_short}"
          gh release create "$tag" \
            desktop-rs/dist/shows-desktop-windows-amd64.zip \
            --title "shows-desktop @ ${sha_short}" \
            --notes "Rust client built from ${GITHUB_SHA}. Download the zip, unpack, and run shows-desktop.exe." \
            --target main \
            --latest
