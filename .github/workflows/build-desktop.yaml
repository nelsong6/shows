name: Build Desktop

# Packages shows-desktop (the PySide6/Qt client under desktop-qt/) for
# Windows with PyInstaller. PyInstaller freezes the host's Python + native
# Qt/WebEngine, so it CANNOT cross-compile on Linux — the job runs on a
# Windows runner. On push to main it publishes a GitHub Release (zip of the
# onedir bundle) tagged with the short SHA and marked `--latest`; on
# PRs/dispatch it validates the build and uploads the zip as an artifact.

on:
  push:
    branches: [main]
    paths:
      - desktop-qt/**
      - .github/workflows/build-desktop.yaml
  # No paths filter on PRs: keep the status check reporting, and
  # short-circuit inside when nothing relevant changed.
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # gh release create + upload assets

concurrency:
  group: build-desktop-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Package shows-desktop for Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # PR short-circuit: always trigger (so the check reports), but skip
      # the ~10-minute Windows build when the PR touched nothing relevant.
      - name: Detect relevant changes
        id: changes
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          base="$(git rev-parse "origin/$BASE_REF")"
          changed="$(git diff --name-only "$base"...HEAD)"
          echo "$changed"
          if printf '%s\n' "$changed" | grep -qE '^(desktop-qt/|\.github/workflows/build-desktop\.yaml$)'; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::No desktop-qt/ changes — short-circuiting."
          fi

      - name: Setup Python
        if: steps.changes.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node
        if: steps.changes.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: desktop-qt/frontend/package-lock.json

      - name: Build React overlay
        if: steps.changes.outputs.skip != 'true'
        working-directory: desktop-qt/frontend
        run: |
          npm ci
          npm run build

      # Same libmpv .7z pin the Go build used. The dev bundle ships
      # libmpv-2.dll, which the spec bundles at the app root and python-mpv
      # loads. Bump the cache key when libmpv bumps.
      - name: Cache libmpv runtime
        if: steps.changes.outputs.skip != 'true'
        id: libmpv-cache
        uses: actions/cache@v4
        with:
          path: desktop-qt/third_party/libmpv
          key: libmpv-windows-20250420-3600c71

      - name: Fetch libmpv (cold cache only)
        if: steps.changes.outputs.skip != 'true' && steps.libmpv-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          version=20250420
          hash=3600c71
          file="mpv-dev-x86_64-${version}-git-${hash}.7z"
          url="https://master.dl.sourceforge.net/project/mpv-player-windows/libmpv/${file}?viasf=1"
          mkdir -p desktop-qt/third_party/libmpv
          curl -fSL -o /tmp/libmpv.7z "$url"
          7z x /tmp/libmpv.7z -odesktop-qt/third_party/libmpv -y
          test -f desktop-qt/third_party/libmpv/libmpv-2.dll

      - name: Install Python deps
        if: steps.changes.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r desktop-qt/requirements.txt pyinstaller

      - name: Package (PyInstaller)
        if: steps.changes.outputs.skip != 'true'
        working-directory: desktop-qt
        env:
          # Absolute path so the spec's libmpv lookup finds the fetched DLL.
          SHOWS_LIBMPV_DIR: ${{ github.workspace }}\desktop-qt\third_party\libmpv
        run: |
          pyinstaller shows-qt.spec --noconfirm
          if (-not (Test-Path dist/shows-qt/shows-qt.exe)) { throw "build failed: shows-qt.exe missing" }

      - name: Zip bundle
        if: steps.changes.outputs.skip != 'true'
        working-directory: desktop-qt
        run: Compress-Archive -Path dist/shows-qt/* -DestinationPath dist/shows-qt-windows-amd64.zip -Force

      # PR + dispatch: upload the zip for download/debugging. Push-to-main
      # distributes via the Release below.
      - name: Upload workflow artifact
        if: steps.changes.outputs.skip != 'true' && (github.event_name != 'push' || github.ref != 'refs/heads/main')
        uses: actions/upload-artifact@v4
        with:
          name: shows-desktop-${{ github.sha }}
          path: desktop-qt/dist/shows-qt-windows-amd64.zip
          if-no-files-found: error
          retention-days: 30

      # Push-to-main: publish a Release tagged with the short SHA, marked
      # --latest so the Releases page surfaces the freshest build.
      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha_short="${GITHUB_SHA:0:7}"
          tag="desktop-${sha_short}"
          gh release create "$tag" \
            desktop-qt/dist/shows-qt-windows-amd64.zip \
            --title "shows-desktop @ ${sha_short}" \
            --notes "PySide6 client packaged from ${GITHUB_SHA}. Download the zip, unpack, and run shows-qt.exe." \
            --target main \
            --latest
